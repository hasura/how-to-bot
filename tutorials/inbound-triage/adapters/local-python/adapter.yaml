tutorial_id: inbound-triage
adapter_id: local-python
version: 0.3.0
runtime:
  implementation: CPython
  tested_version: 3.14.4
  dependencies:
  - how-to-bot 0.3.0
authentication:
  identity_source: trusted RequestContext supplied by the adapter
  requester: synthetic-user-operator
  operator: synthetic-operator
  policy_version: policy-2026-09-01
authorization:
  exact_scope: inbound_events:read
  checks:
  - requester identity
  - current policy version
  - record id
  - source
  - source version
  - reporter ownership
  decision_time: before subject/body validation or routing
tools:
- Python standard library
- SQLite
approval_enforcement: no impact operation or destination exists; every result names Anushrut Gupta as required final-disposition
  owner
idempotency:
  store: SQLite DurableLedger
  identity: event id
  immutable_intent: SHA-256 over timestamp, source, source version, subject, body, and reporter
  guarantees:
  - atomic local cross-process claim on one shared filesystem
  - serial and concurrent exact-replay suppression
  - changed-content conflict
  - owner_run_id-fenced interrupted-claim recovery
  - staged result finalization after deadline and stop-generation verification
telemetry:
  sink: redacted structured in-process TelemetrySink
  events:
  - transition
  - policy_decision
  - claim
  - retry
  - plan
  - outcome
  - tool_inventory
  - side_effect_inventory
  access:
  - tutorial-maintainer
  - independent-reviewer
  retention_days: 30
  loss_behavior: fail visibly before authorization or routing
limits:
  max_items_per_run: 25
  max_text_length: 4000
  max_runtime_seconds: 30
  max_event_age_days: 7
  max_future_skew_minutes: 5
  repeated_error_stop: 2 failed attempts
  step_timeouts_seconds:
    authorize-record: 5
    validate-event: 5
    claim-intent: 10
    plan-route: 5
    record-draft: 5
    recover-run: 30
kill_switch:
  owner: Anushrut Gupta
  reachability: independent shared object callable without model/content cooperation
  checkpoints:
  - received
  - authorized
  - validated
  - claimed
  - planned
  - executing
  - classified
  - recording
  - completed
  - atomic finalization
  resume: owner-only after DurableLedger verifies no executing, failed, cancelled, or staged entry remains
teardown: Owner deletes the SQLite ledger and generated local output; telemetry is process-local.
unsupported:
- live source ingestion or credentials
- multi-host or distributed replay protection
- external write, send, close, assignment, alert, or publication
- model-based routing or production routing accuracy
- recurring or unattended execution
