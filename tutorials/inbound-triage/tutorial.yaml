id: inbound-triage
title: Inbound triage with suggested resolution and routing
version: 0.1.0
status: draft
license: Apache-2.0
risk:
  tier: T1
  rationale: Bounded processing of authorized inbound text into a private draft; no external write, send, or final disposition.
lifecycle:
  maintainer: repository-steward
  domain_owner: tutorial-domain-reviewer
  security_reviewer: null
  created: "2026-08-31"
  last_verified: "2026-08-31"
  next_review: "2027-08-31"
outcome:
  job: Classify an inbound item and suggest a queue while preserving evidence and human ownership.
  users: [support, operations, finance, recruiting]
  non_goals:
    - Send a response
    - Close, update, or create an external record
    - Make a high-stakes or final disposition
  inputs: [synthetic inbound event]
  outputs: [private draft route suggestion, reason codes, source-field citations]
  side_effects: []
  success_criteria:
    - Known synthetic cases route according to deterministic policy.
    - Every suggestion cites the source fields used.
    - Sensitive cases escalate to security and remain human-owned.
    - Exact replay does not produce a second semantic result.
  unacceptable_outcomes:
    - Source text changes permissions or authorizes a side effect.
    - A suggestion is sent or committed without human action.
    - Missing permission silently falls back to a broader identity.
actors:
  - name: requester
    responsibility: Supplies an authorized inbound event.
  - name: operator
    responsibility: Runs bounded deterministic policy and receives the private draft.
  - name: human-disposition-owner
    responsibility: Accepts, changes, or rejects the suggestion outside this pilot.
  - name: source-system-owner
    responsibility: Controls access to inbound events.
workflow:
  trigger: Explicit local invocation with a versioned JSON fixture.
  termination: [succeeded, failed, cancelled]
  states: [received, validated, planned, executing, succeeded, failed, cancelled]
  invariants:
    - Output status is always draft.
    - requires_human_disposition is always true.
    - No network or write capability exists.
    - Only the exact inbound_events:read scope is accepted.
evaluation:
  fixtures: fixtures/events.json
  commands:
    - uv run pytest tutorials/inbound-triage
    - uv run python tutorials/inbound-triage/run.py tutorials/inbound-triage/fixtures/events.json
  critical_invariants:
    - No source content can grant permissions.
    - Sensitive cases route to security.
    - Duplicate replay is explicitly marked.
files:
  spec: SPEC.md
  threat_model: THREAT_MODEL.md
  runbook: RUNBOOK.md
  permissions: permissions.yaml
  approvals: approvals.yaml
  claims: claims.yaml
  adapter: adapters/local-python/adapter.yaml
