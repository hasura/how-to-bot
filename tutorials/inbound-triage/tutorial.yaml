id: inbound-triage
title: Inbound triage with suggested resolution and routing
version: 0.4.0
status: needs_retest
license: Apache-2.0
changelog: CHANGELOG.md
adapters:
- local-python
tested_versions:
  local-python-adapter: 0.4.0
  python: 3.14.4
  uv: 0.12.8
  jsonschema: 4.25.1
  PyYAML: 6.0.2
  pytest: 8.4.1
  ruff: 0.12.11
  fixture-set: inbound-triage-eval-v4
discovery:
  roles:
  - support operator
  - operations operator
  - finance operator
  - recruiting operator
  playbooks:
  - inbound triage
  - private draft routing
  patterns:
  - "authorize \u2192 validate \u2192 plan \u2192 draft \u2192 human disposition"
  - durable idempotency and replay
  - bounded execution with kill switch
  - evidence-grounded abstention and escalation
ownership:
  mode: COMPLETE
  responsibility: Produce one authorized, evidence-grounded private triage draft without taking the final
    disposition.
  owned_object: one versioned inbound event and its private draft disposition
  healthy_or_done_condition: The event has exactly one reconstructable draft outcome or a visible terminal
    failure, cancellation, or abstention; no external side effect occurred.
  verification_evidence:
  - current-policy authorization decision
  - exact source version and UTF-8 byte evidence spans
  - durable fenced ledger state
  - redacted transition, plan, retry, and outcome telemetry
  - frozen evaluation metrics and adversarial regression results
  stop_approval_escalation_boundary:
  - stop on authorization, validation, telemetry, deadline, conflict, or kill-switch failure
  - abstain on unsupported or contradictory evidence
  - route sensitive matches to the named owner
  - leave every final disposition to Anushrut Gupta outside this no-write adapter
progression:
  try_it:
    goal: Run the deterministic pilot once on synthetic events and inspect private drafts.
    actions:
    - install the locked environment with uv sync --frozen
    - run the supplied synthetic fixture through the local adapter
    - confirm outputs remain drafts with exact evidence and no side effects
    exit_condition: The sample run finishes with deterministic drafts and no external action.
  run_repeatedly:
    goal: Prove replay, ordering, recovery, and evaluation behavior are repeatable.
    actions:
    - run all repository and tutorial tests
    - run the frozen evaluation and inspect raw numerators and denominators
    - exercise serial, concurrent, reordered, failed, cancelled, and recovered cases
    exit_condition: All frozen tests and zero-failure invariants pass repeatedly.
  operate_safely:
    goal: Understand the controls required before adapting the playbook to live systems.
    actions:
    - review permissions, approvals, threat model, failure matrix, and runbook
    - keep the adapter no-write until a separately reviewed T2 contract exists
    - retest after every permission, policy, runtime, dependency, model, adapter, or incident change
    - use the owner-controlled kill switch and evidence-bound reconciliation procedure
    exit_condition: Operators can identify authorization, approval, monitoring, recovery, escalation,
      and stop boundaries without inferring them from prompt text.
risk:
  tier: T1
  rationale: Bounded current-policy-authorized synthetic reads produce private drafts only; no network,
    external destination, write, send, or final disposition exists.
  data_class: synthetic inbound text; the reference contract treats live inbound text as confidential
  audience: authorized local operator and named human disposition owner
  capabilities:
  - read one current-policy-authorized supplied record
  - create an in-process private draft
  side_effects: []
lifecycle:
  maintainer: Anushrut Gupta
  domain_owner: Anushrut Gupta
  reliability_reviewer: Independent reviewer bot 372780cd-861e-43a3-8b37-939b82cfa693
  security_exception_owner: Anushrut Gupta
  created: '2026-08-31'
  last_verified: '2026-09-01'
  next_review: '2027-09-01'
  issue_path: https://github.com/hasura/how-to-bot/issues
  security_report_path: https://github.com/hasura/how-to-bot/security/advisories/new
  retest_required: true
  retest_reason: Third independent review found eight runtime, finalization, telemetry, batch, reconciliation,
    evidence-offset, and identity attacks; v0.4.0 includes authored regressions and awaits fresh independent
    reproduction.
  material_change_triggers:
  - permission
  - policy
  - runtime
  - dependency
  - model
  - adapter
  - incident
  retire_migrate_procedure: Mark stale material needs_retest immediately; deprecate or withdraw unsupported
    versions and document replacement or teardown in the changelog.
outcome:
  job: Validate one authorized inbound item and suggest a private draft queue with exact evidence while
    preserving human final disposition.
  users:
  - support operator
  - operations operator
  - finance operator
  - recruiting operator
  non_goals:
  - Send a response or alert.
  - Close, assign, update, create, or publish an external record.
  - Make a high-stakes or final disposition.
  - Claim production routing accuracy or live-source compatibility.
  preconditions:
  - Trusted adapter context identifies requester and operator.
  - Current policy version grants the requester the exact record and source.
  - Exact inbound_events:read scope is active with no broader scope.
  - Kill switch is inactive and reconciled.
  - Redacted telemetry is available.
  inputs:
  - Versioned synthetic inbound event with id, timestamp, source, source version, reporter, subject, and
    body.
  - Trusted request context and current authorization policy.
  outputs:
  - Private draft route suggestion or explicit abstention.
  - Exact source/version/field/span evidence and separated extracted facts versus inference.
  - Structured redacted transition and policy history.
  side_effects: []
  success_criteria:
  - Frozen ordinary cases route according to deterministic policy.
  - Unsupported and contradictory cases abstain.
  - Sensitive cases escalate to security and remain owned by Anushrut Gupta.
  - Serial, concurrent, reordered, and recovered replay yield one semantic outcome.
  - Denied, failed, cancelled, retried, succeeded, and recovered histories are reconstructable.
  unacceptable_outcomes:
  - Source text changes permissions, policy, recipients, tools, approval, or impact.
  - Unauthorized or revoked records reveal content or produce a suggestion.
  - Same event identity with changed content produces a second semantic outcome.
  - Stale, malformed, conflicting, or unsupported input is silently treated as ordinary.
  - Work continues after deadline or kill-switch activation.
  - A suggestion is sent, committed, or finalized automatically.
  assumptions:
  - Adapter-supplied request context and policy are trusted test doubles for current source authorization.
  - The SQLite ledger path is on one trusted local filesystem shared by cooperating local adapter instances.
  - Source versions are immutable identifiers supplied by the source adapter.
  affected_parties:
  - Synthetic reporter represented by each fixture.
  - Authorized requester/operator.
  - Anushrut Gupta as final-disposition and sensitive-exception owner.
  limitations:
  - No live source, credential, model, network, recurring trigger, or external destination is included.
  - SQLite state is durable across local adapter processes and restarts sharing one filesystem, but is
    not a multi-host or distributed ledger.
  - Keyword routing is illustrative and not a production classifier.
  - Timeout enforcement is cooperative at declared step fences; this no-I/O deterministic adapter has
    no blocking external dependency to preempt.
  - Awaiting-approval and partial-side-effect paths are present in the neutral state vocabulary but unreachable
    in this T1 no-write adapter.
actors:
- id: requester
  kind: requester
  identity: synthetic-user-operator
  responsibility: Requests only records granted by current source policy.
  trust: trusted
- id: operator
  kind: operator
  identity: synthetic-operator
  responsibility: Invokes the bounded adapter and reviews its private draft.
  trust: trusted
- id: final-disposition-owner
  kind: approver
  identity: Anushrut Gupta
  responsibility: Accepts, changes, or rejects normal and sensitive suggestions outside this no-write
    pilot.
  trust: trusted
- id: source-owner
  kind: data_owner
  identity: Anushrut Gupta
  responsibility: Owns the example authorization policy and revocation decisions.
  trust: trusted
- id: reporter
  kind: affected_party
  identity: synthetic fixture reporter
  responsibility: Is represented by the supplied event and may be affected by a future disposition.
  trust: untrusted
- id: deterministic-runtime
  kind: tool
  identity: local-python adapter 0.4.0 on Python 3.14.4
  responsibility: Enforces policy, state, deadline, replay, grounding, telemetry, and stop controls.
  trust: trusted
- id: external-destination
  kind: destination
  identity: none in T1 adapter
  responsibility: No destination exists and no external action is possible.
  trust: not_applicable
data_flow:
  assets:
  - inbound content
  - reporter privacy
  - routing integrity
  - authorization policy
  - human disposition authority
  - replay state
  - audit history
  classifications:
  - synthetic-public fixture metadata
  - confidential inbound content model
  - redacted operational telemetry
  untrusted_inputs:
  - event subject
  - event body
  - event timestamp
  - event source assertions
  tools:
  - local-python adapter 0.4.0
  - file-backed SQLite DurableLedger with owner-run fencing
  - redacted telemetry sink
  - generation-fenced owner-controlled kill switch
  destination: private in-process draft returned to the authorized operator; no external destination
  boundaries:
  - Untrusted event metadata is checked against trusted current policy before subject/body validation
    or routing.
  - Untrusted text crosses into deterministic keyword policy as data only.
  - Results cross into redacted telemetry without raw text.
  - Final disposition remains outside the adapter with Anushrut Gupta.
workflow:
  trigger: Explicit local invocation with a versioned synthetic event and trusted request context.
  termination:
  - succeeded
  - failed
  - cancelled
  - reconciled
  states:
  - received
  - validated
  - planned
  - awaiting_approval
  - executing
  - succeeded
  - partially_succeeded
  - failed
  - cancelled
  - reconciled
  invariants:
  - Output status is always draft and requires_human_disposition is true.
  - No network, destination, write, send, close, assign, or publication capability exists.
  - Authorization uses requester identity, current policy version, source, record, and reporter before
    content use.
  - Every execution boundary enforces the deadline and independent kill switch.
  - Telemetry contains identifiers and codes but no raw subject or body.
  steps:
  - id: authorize-record
    input_schema: trusted RequestContext plus event id/source/reporter/source_version metadata
    output_schema: authorized policy decision
    preconditions:
    - telemetry available
    - kill switch inactive
    - deadline unexpired
    postconditions:
    - requester has exact scope and current source/record/reporter grant
    invariants:
    - subject and body are not consulted or logged before authorization
    timeout_seconds: 5
    error_classes:
    - authorization
    - cancelled
    - deadline_exceeded
    - telemetry_unavailable
    exit_conditions:
    - continue to validate-event
    - terminal failed
    - terminal cancelled
  - id: validate-event
    input_schema: authorized versioned event
    output_schema: normalized timezone-aware event metadata
    preconditions:
    - authorize-record succeeded
    postconditions:
    - required fields
    - format
    - size
    - freshness
    - and future-skew checks passed
    invariants:
    - stale or malformed input never reaches routing
    timeout_seconds: 5
    error_classes:
    - validation
    - policy
    - cancelled
    - deadline_exceeded
    exit_conditions:
    - continue to claim-intent
    - terminal failed
    - terminal cancelled
  - id: claim-intent
    input_schema: event identity and content fingerprint
    output_schema: owner, duplicate, conflict, or recovery claim
    preconditions:
    - validate-event succeeded
    postconditions:
    - One owner_run_id-fenced local owner exists for each event identity and immutable fingerprint.
    invariants:
    - Changed-content replay conflicts; exact concurrent replay waits and reuses the original; stale owners
      cannot complete or abort a recovered claim.
    timeout_seconds: 10
    error_classes:
    - conflict
    - repeated_error_stop
    - deadline_exceeded
    - cancelled
    exit_conditions:
    - continue to plan-route
    - return original outcome
    - terminal failed
    - terminal cancelled
  - id: plan-route
    input_schema: authorized validated untrusted subject and body
    output_schema: deterministic matches, exact evidence spans, confidence, and abstention decision
    preconditions:
    - claim-intent ownership acquired
    postconditions:
    - supported route or explicit abstention exists
    invariants:
    - untrusted text cannot alter policy; tied or unsupported routes abstain; sensitive terms escalate
    timeout_seconds: 5
    error_classes:
    - policy
    - cancelled
    - deadline_exceeded
    exit_conditions:
    - continue to record-draft
    - terminal failed
    - terminal cancelled
  - id: record-draft
    input_schema: grounded route plan
    output_schema: TriageResult private draft and structured telemetry
    preconditions:
    - plan-route succeeded
    - kill switch inactive
    - deadline unexpired
    postconditions:
    - The fenced ledger stages one semantic result, rechecks stop and deadline, atomically finalizes it,
      and emits a reconstructable outcome.
    invariants:
    - Raw subject/body are absent; named human disposition remains mandatory; no side effect occurs; post-activation
      success cannot finalize.
    timeout_seconds: 5
    error_classes:
    - policy
    - telemetry_unavailable
    - cancelled
    - deadline_exceeded
    exit_conditions:
    - terminal succeeded
    - terminal failed
    - terminal cancelled
  - id: recover-run
    input_schema: prior failed or cancelled ledger identity plus controlled resume
    output_schema: retried trace and reconciled terminal state
    preconditions:
    - Failure is below repeated-error threshold, durable ledger state is reconciled, stop state is resumed
      by its owner, and policy is current.
    postconditions:
    - recovery is visible and semantic outcome remains singular
    invariants:
    - Resume requires owner action and ledger-verified reconciliation; owner_run_id fencing rejects stale
      completion; no impact exists to compensate.
    timeout_seconds: 30
    error_classes:
    - repeated_error_stop
    - conflict
    - authorization
    - cancelled
    - deadline_exceeded
    exit_conditions:
    - terminal reconciled
    - terminal failed
    - terminal cancelled
state_governance:
  location: File-backed SQLite DurableLedger containing event identity, SHA-256 fingerprint, state, failure
    count, owner_run_id fencing token, and redacted result.
  owner: Anushrut Gupta
  retention_days: 7
  access:
  - tutorial operator through adapter API
  - independent reviewer through tests
  deletion: Owner-only delete(event_id) removes one entry and is regression tested.
  reset: Owner-only reset() clears all entries and is regression tested.
  ordering: Batch processing validates sort keys under a traced run, then sorts received_at ascending
    and event id.
  concurrency: BEGIN IMMEDIATE transactions claim intent across cooperating processes on one local filesystem;
    owner_run_id and staged finalization reject stale completion/abort; exact replay reuses the finalized
    result.
observability:
  events:
  - transition
  - policy_decision
  - claim
  - retry
  - plan
  - outcome
  - tool_inventory
  - side_effect_inventory
  identities:
  - run_id
  - correlation_id
  - event_id
  - requester_id
  - operator_id
  - policy_version
  - owner_run_id
  redaction:
  - omit subject/body and evidence text
  - store only route/outcome/reason/state codes, evidence count, confidence, flags, and identifiers
  - reject unsafe telemetry values
  retention_days: 30
  access:
  - tutorial-maintainer
  - independent-reviewer
  loss_behavior: Telemetry unavailability stops before authorization/routing and raises a visible telemetry_unavailable
    error; it cannot authorize impact.
evaluation:
  fixture_version: inbound-triage-eval-v4
  fixtures: fixtures/evaluation.json
  thresholds: evaluation.yaml
  commands:
  - uv run python tutorials/inbound-triage/evaluate.py
  - uv run pytest tutorials/inbound-triage
  critical_invariants:
  - authorization_failures
  - privacy_leaks
  - automatic_final_dispositions
  - duplicate_semantic_outcomes
  - unsupported_non_abstentions
  - missed_sensitive_escalations
  - deadline_or_kill_switch_bypasses
  - malformed_input_bypasses
  - unreconciled_resume_bypasses
files:
  spec: SPEC.md
  threat_model: THREAT_MODEL.md
  runbook: RUNBOOK.md
  permissions: permissions.yaml
  approvals: approvals.yaml
  claims: claims.yaml
  evaluation: evaluation.yaml
  adapter: adapters/local-python/adapter.yaml
  changelog: CHANGELOG.md
