[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "how-to-bot"
version = "0.3.0"
description = "Verified operational playbooks for workplace bots"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/howtobot"]

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tutorials/inbound-triage/fixtures"]
